schema: spec-driven

# Project context: constraints an agent cannot infer from the code.
context: |
  Rédiger tous les artefacts OpenSpec (proposal, design, specs, tasks) en français.
  ROTI (Return On Time Invested) pour les réunions et ateliers de l'auteur, sans publicité, dépôt public.
  L'animateur crée une salle par réunion ; chaque participant note la réunion de 1 à 5 étoiles depuis son
  téléphone et peut laisser un commentaire. Chaque étoile a un libellé :
  1 « J'ai perdu mon temps », 2 « Peu utile, j'en retire peu de chose », 3 « Correct, ça valait le temps passé »,
  4 « Utile, j'en retire de la valeur », 5 « Génial, j'ai adoré et j'en retire beaucoup de valeur ».
  Anonymat : aucun prénom demandé ; la note et le commentaire sont dissociés, personne (pas même l'animateur)
  ne peut relier un commentaire à une note. Les notes et commentaires restent cachés jusqu'à ce que l'animateur
  clique sur « Révéler » : tout apparaît d'un coup, pour tout le monde (moyenne, répartition, commentaires).
  Un participant peut changer sa note et son commentaire jusqu'à la révélation.
  Gestion des salles : l'animateur retrouve dans son navigateur la liste des ROTI qu'il a créés, peut les rouvrir
  et les supprimer ; les salles sont supprimées automatiquement après 30 jours.
  Hébergement : site statique sur GitHub Pages (https://agileroy.github.io/roti/), sans serveur à maintenir.
  Temps réel : Firebase Realtime Database (offre gratuite, connexion anonyme) dans le projet partagé avec
  poker-planning, matrice-competences, wheel-of-chance, moving-motivators, roles-responsabilites, scrum-events
  et scrum-increment ; database.rules.json doit rester identique dans ces 8 dépôts, et se publie à la main
  dans la console Firebase. Aucun autre service tiers (ni police web, ni CDN, ni traceur, ni publicité).
  N'utiliser que HTTPS (port 443).
  Le VPN de l'entreprise (proxy Zscaler) bloque GitHub Pages et Firebase : les participants votent depuis
  leur téléphone, via le QR code affiché par l'animateur.
  Stack : HTML/CSS/JavaScript vanilla en modules ES, sans framework ni étape de build (dossier site/).
  Identité visuelle des outils frères : mêmes couleurs de base, polices système, thème clair et sombre avec
  bouton de bascule mémorisé.
  Architecture : site/js/roti-core.js contient la logique métier pure (sans DOM ni base), testée avec Node.js ;
  site/js/roti-store.js les actions sur la base ; site/js/firebase-db.js est le seul module qui parle à Firebase,
  site/js/memory-db.js offre la même interface en mémoire (tests et mode démo ?demo) ; site/js/ui.js gère l'interface.
  Les règles de sécurité Firebase (database.rules.json, branche roti) doivent appliquer les mêmes contraintes
  que l'interface. Interface en français, sans compte.
  Tests : lanceur intégré de Node.js (npm test), à faire évoluer avec chaque changement de comportement ;
  la publication GitHub Actions est bloquée si un test échoue.
